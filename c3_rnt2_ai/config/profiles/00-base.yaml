profiles:
  dev_small:
    tokenizer:
      rnt2_model_path: data/runs/rnt2_dev.pt
      vortex_model_path: data/runs/vortex_tok.pt
      block_size: 64
      escape_mode: exact
      macro_codebook_size: 256
      macro_min_len: 2
    core:
      hidden_size: 256
      layers: 4
      heads: 4
      vocab_size: 1024
      mtp_k: 0
      compile_step: false
      compile_local_mixer_step: false
    vortex_model:
      window_size: 128
      latent_slots: 64
      lava_top_k: 4
      lava_clusters: 0
      lava_cluster_top: 1
      lava_read_every: 1
      lava_write_every: 1
      lava_write_on_surprise: false
      lava_surprise_threshold: 0.0
      lava_state_path: data/memory/lava_state.pt
      lava_state_autoload: false
      local_mixer_kernel: 5
      ssm_state_size: 128
      gated_mlp_ratio: 4
    bad:
      block_size: 8
      entropy_threshold: 3.5
      entropy_top_k: 64
      penalty_window: 512
      top_p_min_k: 128
      top_p_max_k: 512
      exact_copy_mode: false
      escape_restrict: false
      use_mtp: true
    kv:
      window_size: 128
      kv_quant_bits: 8
      latent_slots: 32
    c3:
      tile_size: 128
      cache_vram_budget_mb: 2048
      prefetch_depth: 2
      compression: zstd
      pinned_memory: true
    depth_gating:
      enabled: false
      min_depth: 2
      max_depth: 4
      hysteresis: 0.2
      entropy_threshold: 3.5
      entropy_top_k: 64
      compute_cost_weight: 0.0
      smoothness: 1.0
    router:
      top_k: 2
      stability_threshold: 0.1
      mem_cost_weight: 0.01
      enabled: false
      weights:
        speed: 1.0
        vram: 0.01
        error: 5.0
        quality: 1.0
    agent:
      web_allowlist: ["github.com", "docs.python.org", "pytorch.org", "duckduckgo.com"]
      tools_enabled: ["run_tests", "search_web", "open_docs", "propose_patch", "sandbox_patch", "apply_patch", "summarize_diff", "read_file", "grep", "list_tree"]
    tools:
      web:
        enabled: false
        allow_domains: ["github.com", "docs.python.org", "pytorch.org"]
        search_domains: ["duckduckgo.com"]
        max_bytes: 512000
        timeout_s: 10
        rate_limit_per_min: 30
        cache_dir: data/web_cache
        cache_ttl_s: 3600
        allow_content_types: ["text/", "application/json"]
    adapters:
      enabled: false
      max_loaded: 2
      default: null
      paths: {}
      router:
        mode: keyword_map
        keyword_map: {}
        top_k: 1
        mix_mode: single
    knowledge:
      embedding_backend: auto
      embedding_model: sentence-transformers/all-MiniLM-L6-v2
      index_backend: auto
      policy:
        min_quality: 0.0
        max_age_days: null
        allow_domains: null
        deny_domains: null
        allow_source_kinds: null
        deny_source_kinds: null
    self_patch:
      enabled: true
      auto_sandbox: true
      queue_dir: data/self_patch/queue
      sandbox_dir: data/self_patch/sandbox
      max_patch_kb: 128
      run_tests_on_apply: true
      allowed_commands: ["pytest", "ruff", "python"]
      allowed_paths: ["src/", "tests/", "vortex-chat/"]
      forbidden_globs: [".env", ".env.*", "data/**", "*.key", "*.pem", "*.p12", "*.sqlite", "*.db", "keys/**", "secrets/**", "src/c3rnt2/self_patch/**", "src/c3rnt2/selfimprove/**", "src/c3rnt2/autolearn.py"]
    continuous:
      interval_minutes: 30
      adapter_rank: 4
      max_steps: 50
      knowledge_path: data/continuous/knowledge.sqlite
      ingest_web: true
      ingest_urls:
        - "https://docs.python.org/3/"
        - "https://pytorch.org/docs/stable/"
      web_discovery:
        enabled: false
        seed_queries: []
        max_urls_per_tick: 10
      ingest:
        max_files_per_tick: 100
        max_bytes_per_file: 1048576
        max_total_bytes_per_tick: 5242880
        web:
          cooldown_minutes: 60
          sanitize:
            max_chars: 2000
            max_instruction_density: 0.04
            max_repeat_lines: 2
      trigger:
        enabled: true
        min_new_docs: 1
        min_novelty: 0.2
        min_successes: 0
      filter:
        min_quality: 0.35
        max_repeat_ratio: 0.8
        min_chars: 200
        min_novelty: 0.2
        quarantine_limit: 200
      replay:
        path: data/continuous/replay.sqlite
        max_items: 2000
        top_frac: 0.7
        random_frac: 0.3
        sample_size: 64
        seed_chunks: 40
      source_weights:
        episode: 2.0
        web: 1.0
        memory: 0.8
        logs: 0.3
        unknown: 1.0
      eval:
        anchors_path: data/continuous/anchors.jsonl
        max_regression: 0.2
        min_improvement: 0.0
      adapters:
        rank: 4
        alpha: 1.0
        target_modules: ["lm_head", "fc", "proj", "gate", "read_proj", "addr_proj", "out_proj", "in_proj"]
        strict_target_modules: false
      consolidation:
        enabled: false
        every_n_runs: 10
        top_n: 3
        weights:
          loss: 1.0
          anchors: 1.0
          episodes: 0.2
    rag:
      enabled: true
      top_k: 3
      max_chars: 1200
    selfimprove:
      max_patch_kb: 64
      sandbox_root: data/workspaces
    autolearn:
      enabled: false
      interval_minutes: 30
      # --- Web Knowledge Ingest ---
      web_ingest: true
      web_cooldown_minutes: 30
      # Seed URLs — the model discovers more automatically
      urls:
        - "https://docs.python.org/3/tutorial/index.html"
        - "https://pytorch.org/docs/stable/torch.html"
        - "https://huggingface.co/docs/transformers/main/en/index"
        - "https://fastapi.tiangolo.com/tutorial/"
      # URL discovery: model suggests official pages based on project context
      url_discovery: true
      discovery_cooldown_hours: 24
      # Domains are auto-managed (trusted set + model-discovered)
      allow_domains: []
      # --- Self-Code Indexing ---
      code_index: true
      code_index_cooldown_minutes: 60
      # --- Self-Code Analysis ---
      code_analyze: true
      analyze_cooldown_minutes: 120
      analyze_batch_size: 3
  qwen8b_base:
    base_profile: dev_small
    core:
      backend: hf
      hf_model: "Qwen/Qwen2.5-7B-Instruct"
      # Avoid OOM/thrashing on Windows when 4-bit quant (bitsandbytes) isn't available:
      # keep VRAM under bench.max_vram_peak_mb via CPU offload.
      hf_device_map: auto
      hf_max_memory:
        0: "12GiB"
        cpu: "48GiB"
      hf_offload_folder: "data/hf_offload"
      hf_use_safetensors: true
      hf_load_in_4bit: true
      hf_device: cuda
      hf_attn_implementation: sdpa
      hf_system_prompt: "You are Vortex, a helpful coding assistant."
      hf_use_latest_adapter: true
      dtype: bf16
      backend_fallback: vortex
      vram_threshold_mb: 1200
      vram_floor_tokens: 32
      vram_ceil_tokens: 512
      vram_safety_margin_mb: 512
    server:
      auto_reload_adapter: false
      reload_interval_s: 60
      maintenance_window_s: 10
    decode:
      max_new_tokens: 128
    runtime:
      paged_lm_head: false
      # gpu_decompress uses CPU decompress + H2D pipeline; keep "none" unless you know why.
      gpu_decompress: none
      # kv_quant=2bit is experimental; requires kv_quant_2bit_experimental + i_know_what_im_doing.
      i_know_what_im_doing: false
  gemma3_12b_hf_base:
    # Gemma 3 12B IT (gated on Hugging Face). Kept as a smaller fallback profile.
    base_profile: qwen8b_base
    core:
      backend: hf
      hf_model: "google/gemma-3-12b-it"
      hf_model_loader: image_text_to_text
      hf_processor_padding_side: left
      hf_device_map: auto
      hf_max_memory:
        0: "14GiB"
        cpu: "48GiB"
      hf_offload_folder: "data/hf_offload"
      hf_use_safetensors: true
      hf_load_in_4bit: true
      hf_device: cuda
      hf_attn_implementation: sdpa
      hf_system_prompt: "You are Vortex, a helpful coding assistant."
      hf_use_latest_adapter: false
      hf_adapter_path: null
      hf_merge_adapter: false
      dtype: bf16
      backend_fallback: null
      allow_implicit_hf_fallback: false
      vram_threshold_mb: 1600
      vram_floor_tokens: 32
      vram_ceil_tokens: 512
      vram_safety_margin_mb: 768
    decode:
      max_new_tokens: 256
  rtx4080_16gb_gemma3_12b_hf:
    # Smaller Gemma profile preserved for manual selection.
    base_profile: gemma3_12b_hf_base
    core:
      hf_load_in_4bit: true
      hf_device: cuda
      hf_attn_implementation: sdpa
      dtype: bf16
      backend_fallback: null
    decode:
      max_new_tokens: 256
  gemma4_26b_a4b_hf_base:
    # Gemma 4 26B-A4B is the strongest Gemma 4 profile that still makes sense as a
    # primary Windows/HF local model on a RTX 4080 16GB. It keeps Gemma 4 quality
    # while favoring latency and fit over the heavier 31B Dense profile.
    base_profile: qwen8b_base
    core:
      backend: hf
      hf_model: "google/gemma-4-26B-A4B-it"
      hf_model_loader: image_text_to_text
      hf_processor_padding_side: left
      hf_enable_thinking: false
      hf_device_map: auto
      hf_max_memory:
        0: "14GiB"
        cpu: "48GiB"
      hf_offload_folder: "data/hf_offload"
      hf_use_safetensors: true
      hf_load_in_4bit: false
      hf_device: cuda
      hf_attn_implementation: sdpa
      hf_system_prompt: "You are Vortex, a helpful coding assistant."
      hf_use_latest_adapter: false
      hf_adapter_path: null
      hf_merge_adapter: false
      dtype: bf16
      backend_fallback: null
      allow_implicit_hf_fallback: false
      vram_threshold_mb: 2200
      vram_floor_tokens: 24
      vram_ceil_tokens: 384
      vram_safety_margin_mb: 1024
    decode:
      max_new_tokens: 192
  gemma4_e4b_hf_base:
    # Gemma 4 E4B is the strongest practical Gemma 4 profile that starts
    # reliably on a RTX 4080 16 GB without leaning on fragile 4-bit kernels.
    base_profile: gemma4_26b_a4b_hf_base
    core:
      hf_model: "google/gemma-4-E4B-it"
      hf_load_in_4bit: false
      hf_device: cuda
      hf_attn_implementation: sdpa
      dtype: bf16
      backend_fallback: null
    decode:
      max_new_tokens: 192
  rtx4080_16gb_gemma4_26b_a4b_hf:
    # Primary local LLM profile for this machine: Gemma 4 beats Gemma 3, and the
    # 26B-A4B variant is the best practical Gemma 4 target for a 4080 16GB.
    base_profile: gemma4_26b_a4b_hf_base
    core:
      hf_load_in_4bit: false
      hf_device: cuda
      hf_attn_implementation: sdpa
      dtype: bf16
      backend_fallback: null
    server:
      lazy_model_load: true
    decode:
      max_new_tokens: 192
  rtx4080_16gb_gemma4_26b_a4b_hf_docker:
    # Docker runs on Linux and can use bitsandbytes 4-bit quantization, which is
    # the practical way to keep Gemma 4 26B-A4B responsive on a 16 GB RTX 4080.
    base_profile: gemma4_26b_a4b_hf_base
    core:
      hf_load_in_4bit: true
      hf_device: cuda
      hf_attn_implementation: sdpa
      dtype: bf16
      backend_fallback: null
    decode:
      max_new_tokens: 192
  rtx4080_16gb_gemma4_e4b_hf_docker:
    # Default Docker profile: Gemma 4 quality with predictable startup on this PC.
    base_profile: gemma4_e4b_hf_base
    core:
      hf_load_in_4bit: false
      hf_device: cuda
      hf_attn_implementation: sdpa
      dtype: bf16
      hf_use_latest_adapter: true
      hf_merge_adapter: false
      backend_fallback: null
    server:
      auto_reload_adapter: true
      reload_interval_s: 15
      allow_parallel_runtime_training: false
      lazy_model_load: true
    tools:
      web:
        enabled: true
        allow_domains: []
    security:
      web:
        strict: true
        allowlist_domains: []
    continuous:
      ingest_web: false
      ingest_urls: []
      web_discovery:
        enabled: false
        seed_queries: []
        max_urls_per_tick: 0
        max_queue: 0
    autolearn:
      enabled: false
      web_ingest: false
      url_discovery: false
      allow_domains: []
    hf_train:
      registry_dir: "data/registry/hf_train/gemma4_e4b"
    decode:
      max_new_tokens: 192
  gemma4_31b_hf_base:
    # Gemma 4 31B Dense remains the absolute quality ceiling in the Gemma family,
    # but it is heavier and better kept as an opt-in profile on this hardware.
    base_profile: qwen8b_base
    core:
      backend: hf
      hf_model: "google/gemma-4-31B-it"
      hf_model_loader: image_text_to_text
      hf_processor_padding_side: left
      hf_enable_thinking: false
      hf_device_map: auto
      hf_max_memory:
        0: "14GiB"
        cpu: "48GiB"
      hf_offload_folder: "data/hf_offload"
      hf_use_safetensors: true
      hf_load_in_4bit: false
      hf_device: cuda
      hf_attn_implementation: sdpa
      hf_system_prompt: "You are Vortex, a helpful coding assistant."
      hf_use_latest_adapter: false
      hf_adapter_path: null
      hf_merge_adapter: false
      dtype: bf16
      backend_fallback: null
      allow_implicit_hf_fallback: false
      vram_threshold_mb: 2200
      vram_floor_tokens: 24
      vram_ceil_tokens: 384
      vram_safety_margin_mb: 1024
    decode:
      max_new_tokens: 192
  rtx4080_16gb_gemma4_31b_hf:
    # Opt-in maximum-quality Gemma 4 profile.
    base_profile: gemma4_31b_hf_base
    core:
      hf_load_in_4bit: false
      hf_device: cuda
      hf_attn_implementation: sdpa
      dtype: bf16
      backend_fallback: null
    decode:
      max_new_tokens: 192
  rtx4080_16gb:
    # RTX 4080 16GB + Ryzen 7800X3D (HF Qwen-8B)
    base_profile: qwen8b_base
    core:
      hf_load_in_4bit: true
      hf_device: cuda
      hf_attn_implementation: sdpa
      dtype: bf16
      backend_fallback: vortex
    decode:
      max_new_tokens: 256
