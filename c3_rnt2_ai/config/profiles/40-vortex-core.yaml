profiles:
  core_only:
    tokenizer:
      rnt2_model_path: data/runs/rnt2_dev.pt
      vortex_model_path: data/runs/vortex_tok.pt
      block_size: 64
      escape_mode: exact
      macro_codebook_size: 256
      macro_min_len: 2
    core:
      hidden_size: 512
      layers: 6
      heads: 8
      vocab_size: 2048
      mtp_k: 0
      compile_step: false
      compile_local_mixer_step: false
    vortex_model:
      window_size: 256
      latent_slots: 128
      lava_top_k: 4
      lava_clusters: 0
      lava_cluster_top: 1
      lava_read_every: 1
      lava_write_every: 1
      lava_write_on_surprise: false
      lava_surprise_threshold: 0.0
      lava_state_path: data/memory/lava_state.pt
      lava_state_autoload: false
      local_mixer_kernel: 7
      ssm_state_size: 256
      gated_mlp_ratio: 4
    bad:
      block_size: 8
      entropy_threshold: 3.5
      entropy_top_k: 64
      penalty_window: 512
      top_p_min_k: 128
      top_p_max_k: 512
      exact_copy_mode: false
      escape_restrict: false
      use_mtp: true
    kv:
      window_size: 256
      kv_quant_bits: 8
      latent_slots: 64
    depth_gating:
      enabled: false
      min_depth: 2
      max_depth: 6
      hysteresis: 0.2
      entropy_threshold: 3.5
      entropy_top_k: 64
      compute_cost_weight: 0.0
      smoothness: 1.0
  c3_paged:
    tokenizer:
      rnt2_model_path: data/runs/rnt2_dev.pt
      vortex_model_path: data/runs/vortex_tok.pt
      block_size: 64
      escape_mode: exact
      macro_codebook_size: 256
      macro_min_len: 2
    core:
      hidden_size: 512
      layers: 6
      heads: 8
      vocab_size: 2048
      mtp_k: 0
      compile_step: false
      compile_local_mixer_step: false
    vortex_model:
      window_size: 256
      latent_slots: 128
      lava_top_k: 4
      lava_clusters: 0
      lava_cluster_top: 1
      lava_read_every: 1
      lava_write_every: 1
      lava_write_on_surprise: false
      lava_surprise_threshold: 0.0
      lava_state_path: data/memory/lava_state.pt
      lava_state_autoload: false
      local_mixer_kernel: 7
      ssm_state_size: 256
      gated_mlp_ratio: 4
    bad:
      block_size: 8
      entropy_threshold: 3.5
      entropy_top_k: 64
      penalty_window: 512
      top_p_min_k: 128
      top_p_max_k: 512
      exact_copy_mode: false
      escape_restrict: false
      use_mtp: true
    kv:
      window_size: 256
      kv_quant_bits: 8
      latent_slots: 64
    c3:
      tile_size: 128
      cache_vram_budget_mb: 4096
      paged_lm_head_stream_topk: 64
      prefetch_depth: 4
      compression: zstd
      pinned_memory: true
    depth_gating:
      enabled: false
      min_depth: 2
      max_depth: 6
      hysteresis: 0.2
      entropy_threshold: 3.5
      entropy_top_k: 64
      compute_cost_weight: 0.0
      smoothness: 1.0
    router:
      top_k: 4
      stability_threshold: 0.15
      mem_cost_weight: 0.02
      enabled: false
      weights:
        speed: 1.0
        vram: 0.01
        error: 5.0
        quality: 1.0
    continuous:
      interval_minutes: 30
      adapter_rank: 4
      max_steps: 50
    selfimprove:
      max_patch_kb: 64
      sandbox_root: data/workspaces
  agent:
    tokenizer:
      rnt2_model_path: data/runs/rnt2_dev.pt
      vortex_model_path: data/runs/vortex_tok.pt
      block_size: 64
      escape_mode: exact
      macro_codebook_size: 256
      macro_min_len: 2
    core:
      hidden_size: 256
      layers: 4
      heads: 4
      vocab_size: 1024
      mtp_k: 0
      compile_step: false
      compile_local_mixer_step: false
    vortex_model:
      window_size: 128
      latent_slots: 64
      lava_top_k: 4
      lava_clusters: 0
      lava_cluster_top: 1
      lava_read_every: 1
      lava_write_every: 1
      lava_write_on_surprise: false
      lava_surprise_threshold: 0.0
      lava_state_path: data/memory/lava_state.pt
      lava_state_autoload: false
      local_mixer_kernel: 5
      ssm_state_size: 128
      gated_mlp_ratio: 4
    bad:
      block_size: 8
      entropy_threshold: 3.5
      entropy_top_k: 64
      penalty_window: 512
      top_p_min_k: 128
      top_p_max_k: 512
      exact_copy_mode: false
      escape_restrict: false
      use_mtp: true
    kv:
      window_size: 128
      kv_quant_bits: 8
      latent_slots: 32
    depth_gating:
      enabled: false
      min_depth: 2
      max_depth: 4
      hysteresis: 0.2
      entropy_threshold: 3.5
      entropy_top_k: 64
      compute_cost_weight: 0.0
      smoothness: 1.0
    agent:
      web_allowlist: ["github.com", "docs.python.org", "pytorch.org", "duckduckgo.com"]
      tools_enabled: ["run_tests", "search_web", "open_docs", "propose_patch", "sandbox_patch", "apply_patch", "summarize_diff", "read_file", "grep", "list_tree"]
    tools:
      web:
        enabled: false
        allow_domains: ["github.com", "docs.python.org", "pytorch.org"]
        search_domains: ["duckduckgo.com"]
        max_bytes: 512000
        timeout_s: 10
        rate_limit_per_min: 30
        cache_dir: data/web_cache
        cache_ttl_s: 3600
        allow_content_types: ["text/", "application/json"]
    self_patch:
      enabled: false
      auto_sandbox: true
      queue_dir: data/self_patch/queue
      sandbox_dir: data/self_patch/sandbox
      max_patch_kb: 128
      run_tests_on_apply: true
      allowed_commands: ["pytest", "ruff", "python"]
      allowed_paths: ["src/", "tests/"]
      forbidden_globs: [".env", ".env.*", "data/**", "*.key", "*.pem", "*.p12", "*.sqlite", "*.db", "keys/**", "secrets/**", "src/c3rnt2/self_patch/**", "src/c3rnt2/selfimprove/**"]
    continuous:
      interval_minutes: 30
      adapter_rank: 4
      max_steps: 50
    selfimprove:
      max_patch_kb: 64
      sandbox_root: data/workspaces
  rtx4080_16gb_vortexx:
    # Vortex-Tok (reversible, tasa variable, ESC exacto)
    tokenizer:
      type: vortex_tok
      rnt2_model_path: data/runs/rnt2_dev.pt
      vortex_tok_path: data/runs/vortex_tok.pt
      block_size: 64
      escape_mode: exact
      macro:
        enabled: true
        macro_codebook_path: data/runs/vortex_macro.pt
        max_merge: 8
        min_freq: 50

    # Vortex core (V-Blocks + LAVA + SSM)
    core:
      arch: vortex_x
      precision: bf16
      compile: true
      compile_step: false
      compile_local_mixer_step: false
      hidden_size: 768
      layers: 16
      heads: 12
      mlp_ratio: 4
      dropout: 0.0
      mtp_k: 4

      local_window: 1024
      lava_slots: 256
      lava_top_k: 8
      lava_clusters: 64
      lava_cluster_top: 2
      lava_read_every: 1
      lava_write_every: 1
      lava_write_on_surprise: false
      lava_surprise_threshold: 0.0
      lava_state_path: data/memory/lava_state.pt
      lava_state_autoload: false
      lava_addr_dim: 128

      ssm:
        enabled: true
        state_dim: 256
        scan_chunk: 256

    # KV antiguo: úsalo solo como “ventana local” si lo mantienes
    kv:
      window_size: 1024
      kv_quant_bits: 8
      latent_slots: 0

    # Runtime “VRAM como caché” (C3 tiles)
    c3:
      tile_size: 128
      cache_vram_budget_mb: 10000
      prefetch_depth: 4
      compression: zstd
      pinned_memory: true

    router:
      top_k: 4
      stability_threshold: 0.15
      mem_cost_weight: 0.02
      enabled: false
      weights:
        speed: 1.0
        vram: 0.01
        error: 5.0
        quality: 1.0
      hysteresis: 0.1

    decode:
      method: bad
      draft_block: 8
      verify: true
      temperature: 0.7
      top_p: 0.95
      exact_copy_mode: false
      escape_restrict: false
      use_mtp: true
      max_new_tokens: 512
      adaptive_granularity: true
      entropy_top_k: 64
      penalty_window: 512
      top_p_min_k: 128
      top_p_max_k: 512

    depth_gating:
      enabled: true
      min_depth: 8
      max_depth: 16
      hysteresis: 0.2
      entropy_threshold: 3.5
      entropy_top_k: 64
      compute_cost_weight: 0.0
      smoothness: 1.0

    agent:
      web_allowlist:
        - "github.com"
        - "docs.python.org"
        - "pytorch.org"
        - "duckduckgo.com"
        - "developer.nvidia.com"
      tools_enabled: ["open_docs", "search_web", "read_file", "grep", "list_tree", "write_file", "delete_file", "run_tests", "run_command", "open_browser", "propose_patch", "sandbox_patch", "apply_patch", "summarize_diff"]
      rate_limit_per_min: 30
  rtx4080_16gb_safe_vortex:
    # Safer defaults for RTX 4080 16GB (core backend)
    base_profile: rtx4080_16gb_vortexx
    core:
      compile: false
      compile_step: false
      compile_local_mixer_step: false
    c3:
      cache_vram_budget_mb: 4096
      prefetch_depth: 2
    decode:
      max_new_tokens: 256
    continuous:
      ingest_web: false
    tools:
      web:
        enabled: false
    server:
      train_strategy: subprocess_unload
      block_during_training: true
    bench_thresholds:
      min_tokens_per_sec: 5.0
      max_regression: 0.2
  rtx4080_16gb_vortexx_next:
    base_profile: rtx4080_16gb_vortexx
    core:
      cuda_graphs: true
    vortex_model:
      lava_ann_mode: ivf
      lava_cluster_ema: 0.1
      lava_cluster_reassign_threshold: 0.05
      lava_shared_groups: 4
      lava_write_every: 2
    decode:
      draft_model:
        enabled: true
        draft_layers: 6
        draft_hidden: 512
        share_embeddings: true
        share_lm_head: true
    runtime:
      paged_lm_head: true
      paged_tile_out: 256
      paged_tile_in: 768
      cache_vram_budget_mb: 4096
      paged_lm_head_stream_topk: 64
      prefetch_depth: 4
      compression: zstd
      pinned_memory: true
      # gpu_decompress uses CPU decompress + H2D pipeline; keep "none" unless you know why.
      gpu_decompress: none
      # kv_quant=2bit is experimental; requires kv_quant_2bit_experimental + i_know_what_im_doing.
      i_know_what_im_doing: false
  safe_selftrain_4080:
    # Vortex continuous self-train (core trainer), not HF
    base_profile: rtx4080_16gb_vortexx
    server:
      block_during_training: true

    continuous:
      enabled: true
      interval_minutes: 30
      max_steps_per_tick: 200
      lr: 1.0e-4
      batch_tokens: 8192
      knowledge_path: data/continuous/knowledge.sqlite
      ingest_web: true
      ingest:
        max_files_per_tick: 200
        max_bytes_per_file: 2097152
        max_total_bytes_per_tick: 10485760
        web:
          cooldown_minutes: 60
          sanitize:
            max_chars: 2000
            max_instruction_density: 0.04
            max_repeat_lines: 2
      adapters:
        type: lora
        rank: 16
        alpha: 32
        target_modules: ["linear", "proj"]
        strict_target_modules: false
      trigger:
        enabled: true
        min_new_docs: 1
        min_novelty: 0.2
        min_successes: 0
      filter:
        min_quality: 0.35
        max_repeat_ratio: 0.8
        min_chars: 200
        min_novelty: 0.2
        quarantine_limit: 200
      replay:
        path: data/continuous/replay.sqlite
        max_items: 5000
        top_frac: 0.7
        random_frac: 0.3
        sample_size: 128
        seed_chunks: 80
      source_weights:
        episode: 2.0
        web: 1.0
        memory: 0.8
        logs: 0.3
        unknown: 1.0
      eval:
        min_improvement: 0.5
        max_regression: 0.2
        anchors_path: data/continuous/anchors.jsonl
        metrics: ["loss", "exact_copy", "json_valid", "tokens_per_sec"]
      consolidation:
        enabled: false
        every_n_runs: 10
        top_n: 3
        weights:
          loss: 1.0
          anchors: 1.0
          episodes: 0.2
      registry_dir: data/registry
      dataset_dir: data/datasets
      safety:
        forbid_self_patch_during_train: true
  selfimprove_sandbox_4080:
    base_profile: rtx4080_16gb_vortexx

    selfimprove:
      enabled: true
      sandbox_dir: data/workspaces/selfimprove
      runs_dir: data/selfimprove/runs
      require_approval: true
      approval_file: data/APPROVE_SELF_PATCH

      # política de edición (safety kernel)
      allowed_paths:
        - "c3_rnt2_ai/src/c3rnt2/"
        - "c3_rnt2_ai/tests/"
        - "c3_rnt2_ai/config/"
      forbidden_paths:
        - "c3_rnt2_ai/src/c3rnt2/selfimprove/safety_kernel.py"
        - ".git/"
      max_patch_kb: 256
      commands_allowed: ["pytest -q"]
