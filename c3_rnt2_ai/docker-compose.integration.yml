services:
  vortex-api-integration:
    image: python:3.13-slim
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/src
    volumes:
      - .:/workspace
      - ../scripts:/scripts:ro
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn &&
             python /scripts/integration_stub.py --mode api --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20

  vortex-control-integration:
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ../scripts:/scripts:ro
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn &&
             python /scripts/integration_stub.py --mode control --host 0.0.0.0 --port 8765"
    ports:
      - "8765:8765"
    depends_on:
      vortex-api-integration:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20
