services:
  sglang-runtime:
    image: lmsysorg/sglang:v0.4.2-cu121
    restart: unless-stopped
    gpus: all
    shm_size: "32g"
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./data/models/hf-cache:/root/.cache/huggingface
    ports:
      - "30000:30000"
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - Qwen/Qwen2.5-Coder-14B-Instruct-AWQ
      - --served-model-name
      - Qwen/Qwen2.5-Coder-14B-Instruct-AWQ
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --dtype
      - half
      - --mem-fraction-static
      - "0.80"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:30000/v1/models', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 45s

  model-init:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["manual", "qwen-sglang"]
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/src
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - .:/workspace
      - ./data/models/hf-cache:/root/.cache/huggingface
    command:
      - python
      - -m
      - c3rnt2.model_init
      - --model
      - Qwen/Qwen2.5-Coder-14B-Instruct-AWQ
      - --cache-dir
      - /root/.cache/huggingface

  vortex-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    init: true
    restart: unless-stopped
    gpus: all
    ipc: host
    shm_size: "32g"
    depends_on:
      sglang-runtime:
        condition: service_healthy
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/src
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      C3RNT2_ASSUME_DOCKER_READY: "1"
      C3RNT2_HOST_WORKSPACE_MOUNT: /workspaces/root
    volumes:
      - .:/workspace
      - ../:/workspaces/root
      - ./data/models/hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    command:
      - python
      - -m
      - c3rnt2
      - serve
      - --profile
      - ${VORTEX_API_PROFILE:-rtx4080_16gb_programming_runtime_docker}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5).read()"
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 20s

  vortex-api-sglang:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["manual", "qwen-sglang"]
    init: true
    restart: unless-stopped
    gpus: all
    ipc: host
    shm_size: "32g"
    network_mode: "service:sglang-runtime"
    depends_on:
      sglang-runtime:
        condition: service_started
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/src
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      C3RNT2_ASSUME_DOCKER_READY: "1"
      C3RNT2_HOST_WORKSPACE_MOUNT: /workspaces/root
    volumes:
      - .:/workspace
      - ../:/workspaces/root
      - ./data/models/hf-cache:/root/.cache/huggingface
    command:
      - python
      - -m
      - c3rnt2
      - serve
      - --profile
      - ${VORTEX_API_SGLANG_PROFILE:-rtx4080_16gb_programming_local}
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  vortex-control:
    build:
      context: .
      dockerfile: docker/Dockerfile
    init: true
    restart: unless-stopped
    gpus: all
    ipc: host
    shm_size: "32g"
    depends_on:
      vortex-api:
        condition: service_healthy
      sglang-runtime:
        condition: service_healthy
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/src
      HF_HOME: /root/.cache/huggingface
      C3RNT2_ASSUME_DOCKER_READY: "1"
      DOCKER_HOST: unix:///var/run/docker.sock
      C3RNT2_HOST_WORKSPACE_MOUNT: /workspaces/root
    volumes:
      - .:/workspace
      - ../:/workspaces/root
      - ./data/models/hf-cache:/root/.cache/huggingface
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - python
      - -m
      - c3rnt2.control_server
      - --base-dir
      - /workspace
      - --compose-file
      - /workspace/docker-compose.yml
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --api-profile
      - ${VORTEX_API_PROFILE:-rtx4080_16gb_programming_runtime_docker}
      - --training-profile
      - ${VORTEX_TRAINING_PROFILE:-rtx4080_16gb_programming_train_docker}
      - --api-url
      - http://vortex-api:8000
      - --runtime-url
      - http://sglang-runtime:30000
      - --frontend-url
      - http://vortex-frontend:4173
      - --assume-docker-ready
    ports:
      - "8765:8765"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5).read()"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  vortex-frontend:
    build:
      context: ../vortex-chat
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4173:4173"
    depends_on:
      vortex-control:
        condition: service_healthy
      vortex-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:4173/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["manual"]
    init: true
    gpus: all
    ipc: host
    shm_size: "32g"
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/src
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      C3RNT2_ASSUME_DOCKER_READY: "1"
    volumes:
      - .:/workspace
      - ./data/models/hf-cache:/root/.cache/huggingface
    command:
      - python
      - -m
      - c3rnt2
      - doctor
      - --profile
      - rtx4080_16gb_programming_train_docker
      - --mock

  eval:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["manual", "qwen-sglang"]
    init: true
    network_mode: "service:sglang-runtime"
    depends_on:
      - sglang-runtime
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/src
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      C3RNT2_ASSUME_DOCKER_READY: "1"
    volumes:
      - .:/workspace
      - ./data/models/hf-cache:/root/.cache/huggingface
    command:
      - python
      - -m
      - c3rnt2
      - bench
      - --profile
      - rtx4080_16gb_programming_local
      - --scenario
      - default
      - --mock
