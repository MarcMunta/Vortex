services:
  vortex-api:
    build:
      args:
        VORTEX_BACKEND_IMAGE: ${VORTEX_BACKEND_IMAGE:-nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04}
        LLAMA_CPP_CMAKE_ARGS: ${LLAMA_CPP_CMAKE_ARGS:--DGGML_CUDA=on -DCMAKE_CUDA_ARCHITECTURES=89}
        VORTEX_INSTALL_TRAINING: ${VORTEX_INSTALL_TRAINING:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  vortex-control:
    build:
      args:
        VORTEX_BACKEND_IMAGE: ${VORTEX_BACKEND_IMAGE:-nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04}
        LLAMA_CPP_CMAKE_ARGS: ${LLAMA_CPP_CMAKE_ARGS:--DGGML_CUDA=on -DCMAKE_CUDA_ARCHITECTURES=89}
        VORTEX_INSTALL_TRAINING: ${VORTEX_INSTALL_TRAINING:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
